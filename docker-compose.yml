services:
  postgres:
    # 用官方 postgres 镜像（library/postgres，阿里云 mirror 支持），不依赖 pgvector/pgvector 个人 namespace
    # pgvector 扩展在 entrypoint 阶段通过 apt 装入（PGDG apt 源在镜像里已启用）
    image: postgres:17-bookworm
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # 仅在未安装时才 apt install（重启时跳过，加快启动）
        if [ ! -f /usr/share/postgresql/17/extension/vector.control ]; then
          echo "==> Installing pgvector via apt..."
          apt-get update
          apt-get install -y --no-install-recommends postgresql-17-pgvector
          rm -rf /var/lib/apt/lists/*
        fi
        # 交给 postgres 官方 entrypoint 走完整的初始化流程（创建用户/数据库/执行 init scripts）
        exec docker-entrypoint.sh postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
      POSTGRES_DB: "${DATABASE_NAME}"
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    networks:
      - private_chef_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # 2C2G 机器：每个容器封顶内存 + 日志轮转，单容器超限重启而不是整机 OOM
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # MySQL 8.0 默认参数在小内存机器上占用过高，显式调小
    command:
      - --innodb-buffer-pool-size=192M
      - --max-connections=60
      - --table-open-cache=400
      - --performance-schema=OFF
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - shared_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - infra_network
  redis:
    image: redis:7.2.16-alpine
    restart: unless-stopped
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "16379:6379"
    volumes:
      - shared_redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--protected-mode",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - infra_network
  rabbitmq:
    image: rabbitmq:3.8-management
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      RABBITMQ_DEFAULT_USER: "root"
      RABBITMQ_DEFAULT_PASS: "1234"
      RABBITMQ_ERLANG_COOKIE: "rabbitmq_cookie_secure_2024"
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - mq-plugins:/plugins
    networks:
      - infra_network
  # etcd：go-zero 服务注册/发现（sso-login 的 auth-rpc/auth-api 依赖）
  # 用阿里云 ACR 上的 k8s 官方 etcd 镜像镜像源（Docker Hub 第三方 namespace 在国内拉取不稳）
  etcd:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/etcd:3.5.21-0
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 该镜像 ENTRYPOINT/CMD 均为空，command 必须用绝对路径
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-token=etcd-cluster
      - --initial-cluster-state=new
    # 仅绑宿主机 loopback 供调试，不对公网暴露（容器间走 infra_network 服务名）
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - shared_etcd_data:/var/lib/etcd
    healthcheck:
      # 镜像无 shell，必须用 exec 形式（不能用 CMD-SHELL）
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - --endpoints=http://127.0.0.1:2379
        - endpoint
        - health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - infra_network

