# 开发环境配置 (Mac 本地使用)
# 用法: docker compose -p docker-infrastracture -f docker-compose.dev.yml up -d
# 与 docker-compose.yml (生产) 的差异:
#   - 去掉 mem_limit        (开发机资源充足，不封顶)
#   - 去掉 logging 轮转     (dev 重启频繁，日志量小)
#   - 去掉 healthcheck      (开发不需要严格就绪检测)
#   - 网络名 mac_docker_network (暗示开发用)

services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
      POSTGRES_DB: "${DATABASE_NAME}"
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data
    networks:
      - private_chef_network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=192M
      - --max-connections=60
      - --table-open-cache=400
      - --performance-schema=OFF
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - shared_mysql_data:/var/lib/mysql
    networks:
      - mac_docker_network

  redis:
    image: redis:7.2.16-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - shared_redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--protected-mode",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - mac_docker_network

  rabbitmq:
    image: rabbitmq:3.8-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "root"
      RABBITMQ_DEFAULT_PASS: "1234"
      RABBITMQ_ERLANG_COOKIE: "rabbitmq_cookie_secure_2024"
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - mq-plugins:/plugins
    networks:
      - mac_docker_network

volumes:
  shared_postgres_data:
  shared_mysql_data:
  shared_redis_data:
  mq-plugins:

networks:
  private_chef_network:
    name: private_chef_network
    driver: bridge
  mac_docker_network:
    name: mac_docker_network
    driver: bridge
